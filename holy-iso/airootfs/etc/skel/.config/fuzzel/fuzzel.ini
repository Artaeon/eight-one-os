# EIGHT.ONE OS — Fuzzel Launcher Config

[main]
font=JetBrainsMono Nerd Font:size=13
terminal=kitty -e
layer=overlay
prompt=
icons-enabled=yes
icon-theme=Papirus-Dark
horizontal-pad=24
vertical-pad=16
inner-pad=8
line-height=28
letter-spacing=0.5
lines=12
width=45
tabs=4
match-mode=fzf

[colors]
background=0a0a0fee
text=e8e6dfff
match=00ff41ff
selection=00ff4122
selection-text=00ff41ff
border=00ff41cc

[border]
width=2
radius=0
